name: KVM readiness
on:
  pull_request:
    paths:
      - '.github/workflows/talkback-runtime.yml'
      - 'scripts/talkback-ci/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: kvm-readiness-${{ github.ref }}
  cancel-in-progress: false
jobs:
  kvm-readiness:
    name: Hardware-only KVM readiness
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Unit suite
        shell: bash
        run: |
          python3 -B -m unittest discover -s scripts/talkback-ci/tests -v
      - name: Prepare disposable runner KVM access
        shell: bash
        run: |
          test -c /dev/kvm
          id -u
          id -g
          stat -L -c '%u %g %a' /dev/kvm
          if test -r /dev/kvm && test -w /dev/kvm; then
            :
          else
            sudo -n chown -- "$(id -u):$(id -g)" /dev/kvm
            sudo -n chmod -- u+rw /dev/kvm
          fi
          test -c /dev/kvm
          test -r /dev/kvm
          test -w /dev/kvm
          stat -L -c '%u %g %a' /dev/kvm
      - name: Probe KVM
        shell: bash
        env:
          HARNESS_ROOT: ${{ github.workspace }}
          KVM_DEVICE: /dev/kvm
        run: |
          python3 -B "$HARNESS_ROOT/scripts/talkback-ci/probe.py" --device "$KVM_DEVICE"
