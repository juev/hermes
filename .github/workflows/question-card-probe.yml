name: Question card probe

# Temporary: repeats the Android unit suite on the runner to reproduce the intermittent
# missing question card (juev/hermes#180) with the test-side diagnostic in place.
on:
  push:
    branches: [hermes/question-card-readiness]
  workflow_dispatch:
    inputs:
      suites:
        description: Full-suite rounds after the exact CI round
        default: "2"
      classes:
        description: QuestionCardTest rounds
        default: "8"

permissions:
  contents: read

concurrency:
  group: question-card-probe-${{ github.run_id }}

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-go@v7
        with:
          go-version-file: tailnet/go.mod
          cache-dependency-path: tailnet/go.sum
      - uses: gradle/actions/setup-gradle@v6
      - name: Install the native NDK
        run: |
          mkdir -p build/native-evidence
          revision=$(cat scripts/android-ndk-version)
          set -o pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$revision" 2>&1 | tee build/native-evidence/ndk-install.log
          for variable in ANDROID_NDK_HOME ANDROID_NDK_ROOT NDK_HOME NDK_ROOT; do
            echo "$variable=$ANDROID_HOME/ndk/$revision" >> "$GITHUB_ENV"
          done
      - name: Test native guards
        run: python3 -B -m unittest discover -s scripts/tests -v
      - run: ./scripts/build-tailnet.sh
      - name: Repeat the suite until a round fails
        env:
          SUITES: ${{ github.event.inputs.suites || '2' }}
          CLASSES: ${{ github.event.inputs.classes || '8' }}
        run: |
          set -u
          mkdir -p evidence
          round() {
            label=$1; shift
            started=$(date +%s)
            set +e
            ./gradlew --no-daemon --console=plain "$@" 2>&1 | tee "evidence/$label.log"
            rc=${PIPESTATUS[0]}
            set -e
            echo "$label rc=$rc seconds=$(( $(date +%s) - started ))" | tee -a evidence/summary.txt
            mkdir -p "evidence/$label-results"
            cp app/build/test-results/testDebugUnitTest/*.xml "evidence/$label-results/" 2>/dev/null || true
            cp -r app/build/reports/tests/testDebugUnitTest "evidence/$label-html" 2>/dev/null || true
            return "$rc"
          }
          # The exact command of the Android CI job: the failing runs came from it.
          round ci-exact assembleDebug testDebugUnitTest lintDebug assembleRelease || exit 1
          for i in $(seq 1 "$SUITES"); do
            round "suite-$i" :app:testDebugUnitTest --rerun --no-build-cache || exit 1
          done
          for i in $(seq 1 "$CLASSES"); do
            round "class-$i" :app:testDebugUnitTest --rerun --no-build-cache \
              --tests 'org.evsyukov.hermes.ui.chat.QuestionCardTest' || exit 1
          done
          echo "no reproduction in $SUITES suites and $CLASSES classes" | tee -a evidence/summary.txt
      - name: Upload the evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: question-card-evidence
          path: evidence/
          if-no-files-found: warn
