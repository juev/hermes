name: Flaky repro

# Runs the unit suite again and again on the runner where the flaky
# ConnectionChatTest fails (#56), and keeps the log of the run that failed.
on:
  push:
    branches: [hermes/flaky-connection-chat-repro]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repeat:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-go@v7
        with:
          go-version-file: tailnet/go.mod
          cache-dependency-path: tailnet/go.sum
      - uses: gradle/actions/setup-gradle@v6
      - run: ./scripts/build-tailnet.sh
      - name: Repeat the unit suite until one run fails
        run: |
          set -u
          runs="${RUNS:-12}"
          for i in $(seq 1 "$runs"); do
            echo "=== run $i of $runs ==="
            if ./gradlew --console=plain :app:cleanTestDebugUnitTest :app:testDebugUnitTest > "run-$i.log" 2>&1; then
              echo "run $i: passed"
            else
              echo "run $i: FAILED"
              grep -n -A6 "FAILED" "run-$i.log" | head -60
              mkdir -p failed
              cp "run-$i.log" failed/
              cp -r app/build/test-results/testDebugUnitTest failed/ 2>/dev/null || true
              break
            fi
          done
        env:
          RUNS: "12"
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: flaky-repro
          path: |
            run-*.log
            failed/
          if-no-files-found: warn
