name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Debug and release builds with the tailnet node, unit tests, lint. The release is built unsigned: it is
  # there to catch what R8 breaks.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-go@v7
        with:
          go-version-file: tailnet/go.mod
          cache-dependency-path: tailnet/go.sum
      - uses: gradle/actions/setup-gradle@v6
      - name: Install the native NDK
        run: |
          mkdir -p build/native-evidence
          revision=$(cat scripts/android-ndk-version)
          set -o pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$revision" 2>&1 | tee build/native-evidence/ndk-install.log
          for variable in ANDROID_NDK_HOME ANDROID_NDK_ROOT NDK_HOME NDK_ROOT; do
            echo "$variable=$ANDROID_HOME/ndk/$revision" >> "$GITHUB_ENV"
          done
      - name: Test native guards
        run: python3 -B -m unittest discover -s scripts/tests -v
      - run: ./scripts/build-tailnet.sh
      - run: ./gradlew assembleDebug testDebugUnitTest lintDebug assembleRelease
      - name: Validate native APKs
        run: |
          zipalign=$(ls "$ANDROID_HOME"/build-tools/*/zipalign | sort -V | tail -1)
          reports=$(mktemp -d build/native-evidence/ci-apks.XXXXXX)
          python3 scripts/validate-native-artifact.py app/build/outputs/apk/debug/app-debug.apk --zipalign "$zipalign" --report "$reports/debug.json"
          python3 scripts/validate-native-artifact.py app/build/outputs/apk/release/app-release-unsigned.apk --zipalign "$zipalign" --report "$reports/release.json"
      - name: Retain native evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-native-evidence
          path: build/native-evidence/
          if-no-files-found: error
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: app/build/reports/

  # The hermes-push plugin of the server, offline.
  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - working-directory: server/hermes-push
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet cryptography http_ece
          "$RUNNER_TEMP/venv/bin/python" -m unittest discover -s tests

  # Minimal Android channel, including the actual documented dashboard loader.
  android-channel-plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Install minimal SDK test dependencies
        run: |
          python -m venv "$RUNNER_TEMP/channel-venv"
          "$RUNNER_TEMP/channel-venv/bin/pip" install -r server/hermes-android/requirements-test.txt
      - name: Fetch the pinned dashboard SDK source
        run: |
          # Hermes intentionally does not publish wheels. Test the loader source,
          # not an installation of the unrelated full agent/browser dependency set.
          mkdir -p "$RUNNER_TEMP/hermes-sdk"
          curl --fail --location --silent --show-error https://github.com/NousResearch/hermes-agent/archive/2bd378ed1b8d6bf2192cb26e0a55ff3091e6bd19.tar.gz -o "$RUNNER_TEMP/hermes-sdk.tar.gz"
          tar -xzf "$RUNNER_TEMP/hermes-sdk.tar.gz" -C "$RUNNER_TEMP/hermes-sdk" --strip-components=1
      - name: Exercise channel boundaries and measured loopback delivery
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          PYTHONPATH="$RUNNER_TEMP/hermes-sdk" "$RUNNER_TEMP/channel-venv/bin/python" -m unittest discover -s server/hermes-android/tests -v

  # Android transport: a real gateway platform, not a dashboard plugin.
  android-transport-plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Install transport test dependencies
        run: |
          python -m venv "$RUNNER_TEMP/transport-venv"
          "$RUNNER_TEMP/transport-venv/bin/pip" install -r server/hermes-android-transport/requirements-test.txt
      - name: Fetch the pinned gateway SDK source
        run: |
          # Same pinned gateway source the channel job uses: registration,
          # platform_registry and BasePlatformAdapter are exercised from source.
          mkdir -p "$RUNNER_TEMP/hermes-sdk"
          curl --fail --location --silent --show-error https://github.com/NousResearch/hermes-agent/archive/2bd378ed1b8d6bf2192cb26e0a55ff3091e6bd19.tar.gz -o "$RUNNER_TEMP/hermes-sdk.tar.gz"
          tar -xzf "$RUNNER_TEMP/hermes-sdk.tar.gz" -C "$RUNNER_TEMP/hermes-sdk" --strip-components=1
      - name: Exercise the transport over loopback
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          PYTHONPATH="$RUNNER_TEMP/hermes-sdk" "$RUNNER_TEMP/transport-venv/bin/python" -m unittest discover -s server/hermes-android-transport/tests -v
