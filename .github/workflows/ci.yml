name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Debug and release builds with the tailnet node, unit tests, lint. The release is built unsigned: it is
  # there to catch what R8 breaks.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-go@v7
        with:
          go-version-file: tailnet/go.mod
          cache-dependency-path: tailnet/go.sum
      - uses: gradle/actions/setup-gradle@v6
      - name: Install the native NDK
        run: |
          mkdir -p build/native-evidence
          revision=$(cat scripts/android-ndk-version)
          sdkmanager "ndk;$revision" 2>&1 | tee build/native-evidence/ndk-install.log
          for variable in ANDROID_NDK_HOME ANDROID_NDK_ROOT NDK_HOME NDK_ROOT; do
            echo "$variable=$ANDROID_HOME/ndk/$revision" >> "$GITHUB_ENV"
          done
      - name: Test native guards
        run: python3 -B -m unittest discover -s scripts/tests -v
      - run: ./scripts/build-tailnet.sh
      - run: ./gradlew assembleDebug testDebugUnitTest lintDebug assembleRelease
      - name: Validate native APKs
        run: |
          zipalign=$(ls "$ANDROID_HOME"/build-tools/*/zipalign | sort -V | tail -1)
          reports=$(mktemp -d build/native-evidence/ci-apks.XXXXXX)
          python3 scripts/validate-native-artifact.py app/build/outputs/apk/debug/app-debug.apk --zipalign "$zipalign" --report "$reports/debug.json"
          python3 scripts/validate-native-artifact.py app/build/outputs/apk/release/app-release-unsigned.apk --zipalign "$zipalign" --report "$reports/release.json"
      - name: Retain native evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-native-evidence
          path: build/native-evidence/
          if-no-files-found: error
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: app/build/reports/

  # The hermes-push plugin of the server, offline.
  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - working-directory: server/hermes-push
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet cryptography http_ece
          "$RUNNER_TEMP/venv/bin/python" -m unittest discover -s tests
