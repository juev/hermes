name: Release

# A tag v1.2.3 builds the signed APK of version 1.2.3 and publishes it as a GitHub release.
# Started by hand, the workflow builds the same APK and keeps it as an artifact only.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Version to build, without the v
        required: true
        default: 0.1.0

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ github.event_name == 'push' && github.ref_name || inputs.version }}
    steps:
      # The release notes are made from the commits since the previous tag.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-go@v7
        with:
          go-version-file: tailnet/go.mod
          cache-dependency-path: tailnet/go.sum
      - uses: gradle/actions/setup-gradle@v6
      - name: Install the native NDK
        run: |
          mkdir -p build/native-evidence
          revision=$(cat scripts/android-ndk-version)
          set -o pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$revision" 2>&1 | tee build/native-evidence/ndk-install.log
          for variable in ANDROID_NDK_HOME ANDROID_NDK_ROOT NDK_HOME NDK_ROOT; do
            echo "$variable=$ANDROID_HOME/ndk/$revision" >> "$GITHUB_ENV"
          done
      - name: Test native guards
        run: python3 -B -m unittest discover -s scripts/tests -v
      # The built-in Tailscale node goes into every release.
      - run: ./scripts/build-tailnet.sh
      - name: Restore the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.HERMES_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/hermes-release.jks"
          echo "HERMES_KEYSTORE=$RUNNER_TEMP/hermes-release.jks" >> "$GITHUB_ENV"
      - name: Build
        env:
          HERMES_KEYSTORE_PASSWORD: ${{ secrets.HERMES_KEYSTORE_PASSWORD }}
          HERMES_KEY_ALIAS: ${{ secrets.HERMES_KEY_ALIAS }}
          HERMES_KEY_PASSWORD: ${{ secrets.HERMES_KEY_PASSWORD }}
        run: |
          version="${VERSION#v}"
          ./gradlew testDebugUnitTest assembleRelease -Phermes.version="$version"
          mv app/build/outputs/apk/release/app-release.apk "hermes-$version.apk"
          echo "APK=hermes-$version.apk" >> "$GITHUB_ENV"
      - name: Check the signature
        run: |
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$apksigner" verify --print-certs "$APK"
      - name: Validate native APK
        run: |
          zipalign=$(ls "$ANDROID_HOME"/build-tools/*/zipalign | sort -V | tail -1)
          reports=$(mktemp -d build/native-evidence/release-apk.XXXXXX)
          python3 scripts/validate-native-artifact.py "$APK" --zipalign "$zipalign" --report "$reports/release.json"
      - name: Retain native evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-native-evidence
          path: build/native-evidence/
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.APK }}
          path: ${{ env.APK }}
      - if: success() && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        # A tag with a suffix, v1.2.3-rc1, is published as a pre-release.
        run: |
          prerelease=
          case "$GITHUB_REF_NAME" in *-*) prerelease=--prerelease ;; esac
          gh release create "$GITHUB_REF_NAME" "$APK" --title "Hermes ${GITHUB_REF_NAME#v}" --generate-notes $prerelease
